# root-guard keeps conda-forge's ROOT out of hep-forge environments on Linux,
# where hep-forge builds ROOT itself (root_base ==9999 never exists). On macOS
# hep-forge has no ROOT: its packages there run on conda-forge's, so the guard
# must not block it. Two noarch builds, chosen by the virtual package of the
# installing machine: target_os=linux keeps the guard, target_os=osx is empty.
package:
  name: root-guard
  version: "1.1"

build:
  number: 0
  string: "{{ target_os }}"
  noarch: generic

requirements:
  run:
    - __{{ target_os }}
  run_constrained:
{% if target_os == "linux" %}
    - root_base ==9999
{% endif %}

about:
  home: https://root.cern/
  license: LGPL-2.1-only
  summary: "ROOT: analyzing petabytes of data, scientifically."
  description: |
      ROOT is a modular scientific software toolkit. It provides all the functionalities needed to deal with big data
      processing, statistical analysis, visualisation and storage. It is mainly written in C++ but integrated with other
      languages such as Python and R.

extra:
  recipe-maintainers:
    - meiyasan
