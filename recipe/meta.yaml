# root-guard keeps conda-forge's ROOT (root_base) out of hep-forge
# environments, on every platform: hep-forge builds ROOT itself on Linux and
# macOS, and root_base ==9999 never exists. 1.1 lifted the guard on macOS and
# is withdrawn; 2 restores it everywhere.
package:
  name: root-guard
  version: "2"

build:
  number: 0
  noarch: generic

requirements:
  run_constrained:
    - root_base ==9999

about:
  home: https://root.cern/
  license: LGPL-2.1-only
  summary: "ROOT: analyzing petabytes of data, scientifically."
  description: |
      ROOT is a modular scientific software toolkit. It provides all the functionalities needed to deal with big data
      processing, statistical analysis, visualisation and storage. It is mainly written in C++ but integrated with other
      languages such as Python and R.

extra:
  recipe-maintainers:
    - meiyasan
